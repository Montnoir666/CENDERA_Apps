<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CENDERA — Login</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#16181A;}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;}
  .card{background:#1E2124;border-radius:12px;padding:36px 40px;width:320px;
    box-shadow:0 8px 28px rgba(0,0,0,0.45);text-align:center;}
  .wordmark{font-size:30px;font-weight:800;letter-spacing:3px;color:#C9A227;margin:0;}
  .tagline{color:#8a8f96;font-size:12px;margin:4px 0 28px;letter-spacing:0.5px;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:#bbb;margin-bottom:5px;}
  .field input{width:100%;box-sizing:border-box;padding:9px 10px;border-radius:6px;
    border:1px solid #33383d;background:#101214;color:#eee;font-size:14px;}
  .field input:focus{outline:none;border-color:#C9A227;}
  button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:6px;
    background:#C9A227;color:#16181A;font-weight:bold;font-size:14px;cursor:pointer;}
  button:hover{background:#ddb52e;}
  .error{background:#3a1518;color:#ff8f8f;border:1px solid #6b2328;border-radius:6px;
    padding:8px 10px;font-size:12px;margin-bottom:16px;}
  .hint{color:#666;font-size:11px;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="wordmark">CENDERA</p>
    <p class="tagline">by Cendera Technologies</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Log in</button>
    </form>
    <p class="hint">Oil Palm WC Dashboard</p>
  </div>
</div>
</body>
</html>
