<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CENDERA — Login</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#E9EFDC;}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;}
  .card{background:#E9EFDC;border:1.5px solid #1F4D36;border-radius:12px;padding:36px 40px;width:320px;
    box-shadow:0 8px 28px rgba(27,46,34,0.18);text-align:center;}
  .wordmark-row{display:flex;align-items:center;justify-content:center;gap:10px;}
  .wordmark-row svg{color:#C9A227;flex:0 0 auto;}
  .wordmark{font-size:30px;font-weight:800;letter-spacing:3px;color:#C9A227;margin:0;}
  .tagline{color:#5C7267;font-size:12px;margin:4px 0 28px;letter-spacing:0.5px;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:#5C7267;margin-bottom:5px;}
  .field input{width:100%;box-sizing:border-box;padding:9px 10px;border-radius:6px;
    border:1.5px solid #1F4D36;background:#FFFFFF;color:#1B2E22;font-size:14px;}
  .field input:focus{outline:none;border-color:#C9A227;}
  button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:6px;
    background:#C9A227;color:#1B2E22;font-weight:bold;font-size:14px;cursor:pointer;}
  button:hover{background:#ddb52e;}
  .error{background:#FBE6E6;color:#A02020;border:1px solid #E3A9A9;border-radius:6px;
    padding:8px 10px;font-size:12px;margin-bottom:16px;}
  .hint{color:#5C7267;font-size:11px;margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="wordmark-row">
      <svg width="30" height="35" viewBox="0 0 100 116" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
        <path d="M50 6 L87 27 L87 73 L50 94 L13 73 L13 27 Z"/>
        <path d="M26 46 L50 24 L74 46" stroke-width="8"/>
        <path d="M35 64 L50 48 L65 64" stroke-width="8"/>
        <path d="M50 64 L50 92" stroke-width="8"/>
      </svg>
      <p class="wordmark">CENDERA</p>
    </div>
    <p class="tagline">by Cendera Technologies</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Log in</button>
    </form>
    <p class="hint">Oil Palm WC Dashboard</p>
  </div>
</div>
</body>
</html>
